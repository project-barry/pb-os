# Retroid Pocket Duo: its stock Android fan policy (read over fan.conf).
#
# Retroid's RPSettings "Smart" mode (the Duo's default): duty =
# 30000 ns x curve % of the 40000 ns period, curve on the CPU temperature
# (C:%) 25:20 45:20 65:45 85:70 105:100, linear, off below 25 C; the
# fan never runs above 30000 ns = 75 %. In pwm1 units (0..255 of the
# period, as pwm-fan writes it): 25-45 C 38, 65 C 86, 85 C 134, 105 C 191.
# Stock reads the average of the CPU zones; pbos-platformd uses the average
# of the three hottest cpu/gpu/video/mem zones (a little warmer).
# The kernel's own fan trips (Retroid's DT) are removed in the Duo's
# eliza-retroidpocket-rpduo.append so only this curve drives the fan.

[profile.eco]
fan_curve=duo

[profile.balanced]
fan_curve=duo

[profile.performance]
fan_curve=duo

[profile.max]
fan_curve=duo_max

[fan_curve.duo]
curve=105:191,85:134,65:86,45:38,25:38,24:0,0:0

# Stock's fixed "Custom" maximum (30000 ns).
[fan_curve.duo_max]
curve=0:191

[fan]
min_pwm=0
max_pwm=191
