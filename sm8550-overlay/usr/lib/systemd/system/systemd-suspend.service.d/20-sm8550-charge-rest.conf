# SM8550: on the charger, no kernel suspend (deep sleep charges at a quarter
# of the speed): sm8550-charge-rest rests the device and shows the charging
# indicator; without a charger it runs systemd-sleep. Replaces
# 10-konkr-standby.conf's ExecStart on SM8550 (sm8550-charge-rest hands any
# other SoC back to konkr-suspend).
[Unit]
ConditionPathExists=/usr/lib/steamos-sm8550/sm8550-charge-rest

[Service]
ExecStart=
ExecStart=/usr/lib/steamos-sm8550/sm8550-charge-rest suspend
