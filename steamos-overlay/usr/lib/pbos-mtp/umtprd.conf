#
# uMTP-Responder config for PB-OS. The image's own: pbos-mtp fills in the
# @...@ places for this device and writes the result to
# /run/pbos-mtp/umtprd.conf. To change any of it, put a complete config of
# your own at /etc/umtprd/umtprd.conf and it is used as-is instead (no
# substitution: write real paths there).
#
# Upstream's own example, with every option explained, is conf/umtprd.conf in
# external-and-mods/uMTP-Responder's source.
#

# Stay up when the host goes away, so a sleep, a rest or an unplugged cable
# does not end the service: umtprd waits for the host to come back.
loop_on_disconnect 1

# umtprd runs as root (only root can open the FunctionFS endpoints), but every
# file operation is done as the desktop user, so anything copied in is owned
# by them and not by root.
default_uid @UID@
default_gid @GID@
umask 022

# What the PC sees, one `storage` line per folder. The PB-OS tab's USB File
# Transfer section adds and removes them (kept in /var/lib/pbos-mtp/shares.json
# and turned into these lines by `pbos-mtp storages`); without that file it is
# the home folder and the Steam folder, which is the same files by a shorter
# path, for dropping in saves, mods or emulator content.
#
# Writing into a library while Steam is running is the user's risk - MTP has no
# locking, and Steam will not notice files changing under it.
@STORAGES@

manufacturer "Project Barry"
product "@PRODUCT@"
serial "@SERIAL@"
firmware_version "PB-OS"

# Keeps libmtp's vendor-specific quirk handling out of the way.
mtp_extensions "microsoft.com: 1.0; android.com: 1.0;"
interface "MTP"

# The battery shows up on the host next to the device.
battery_capacity "/sys/class/power_supply/battery/capacity"
# 0x3, mobile handset: Windows shows a phone rather than a disk, which is the
# closest thing to a handheld it has an icon for.
perceived_device_type 0x3

usb_vendor_id  0x1d6b
usb_product_id 0x0100
usb_class 0x6
usb_subclass 0x1
usb_protocol 0x1
usb_dev_version 0x3008

# The Steam folder churns constantly while Steam runs, and upstream calls the
# inotify event support beta: with it on, the log fills with stat() failures
# for files Steam has already replaced. Off.
no_inotify 0x1

# Dot files and folders stay out of sight. Home is shared read-write and
# nothing asks before a PC connects, so with them listed any PC on the cable
# could read ~/.ssh keys and browser profiles and write into ~/.ssh or
# ~/.config/autostart. A share whose own path is hidden (the Steam folder)
# still works: only entries inside a share are filtered. Upstream shows them
# by default. Patch 0001 makes umtprd refuse new and renamed dot names too,
# so a PC cannot write ~/.bashrc by name (external-and-mods/uMTP-Responder).
show_hidden_files 0x0

# Not fsyncing every file as it closes: closing the lid lets the UDC go
# outright (60-pbos-mtp.conf), so a transfer in flight dies with the "cable"
# either way, and the fsync costs write throughput.
# sync_when_close 0x1

# Upstream defaults to 8 KB per bulk transfer (16*512) out of a 1 MB cache,
# sized for iMX6-class hardware; on a SuperSpeed link that is one round trip
# per 8 KB. Measured on the AYN Thor, read throughput climbs 70 / 97 / 108 /
# 118 MB/s at 64 KB / 256 KB / 1 MB / 2 MB and falls back to 116 at 4 MB, so:
# 2 MB transfers out of a 16 MB cache. The transfer sizes must be multiples of
# 512 and smaller than the cache, and the cache a power of two.
usb_max_rd_buffer_size 0x200000
usb_max_wr_buffer_size 0x200000
read_buffer_cache_size 0x1000000

usb_functionfs_mode 0x1
usb_dev_path   "/dev/ffs-umtp/ep0"
usb_epin_path  "/dev/ffs-umtp/ep1"
usb_epout_path "/dev/ffs-umtp/ep2"
usb_epint_path "/dev/ffs-umtp/ep3"
usb_max_packet_size 0x200
