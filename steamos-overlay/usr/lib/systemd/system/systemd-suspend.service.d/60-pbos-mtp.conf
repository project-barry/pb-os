# MTP goes away for the whole of a sleep and comes back with the device.
#
# Closing the lid on the charger does not suspend: pbos-platformd's charge
# rest freezes the user slice and pins every CPU to its lowest frequency.
# pbos-mtp.service is a system service and keeps answering through that, but
# at a crawl, and a host that waits long enough drops the device anyway. A
# kernel sleep is worse: the SoC collapses and the USB controller loses power
# under the host's feet, which is what wedges Explorer.
#
# So the UDC is let go before either, which hosts read as an unplug, and taken
# again after the wake. A transfer in flight is lost - the same as pulling the
# cable, which is what closing the lid means here. umtprd stays running
# (loop_on_disconnect) and waits for the host to come back.
#
# One drop-in covers both paths because both are systemd-suspend.service: its
# ExecStart is the charge rest, which rests and/or calls systemd-sleep.
# Measured on the AYN Thor: the device leaves the host's This PC 4 s after the
# suspend request and is back 4 s after the wake.
[Service]
ExecStartPre=-/usr/lib/pbos-mtp/pbos-mtp unbind
ExecStopPost=-/usr/lib/pbos-mtp/pbos-mtp bind
