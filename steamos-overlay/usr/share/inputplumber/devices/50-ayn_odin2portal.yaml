# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/composite_device_v1.json
# AYN Odin 2 Portal rsinput → a real Steam Deck controller (deck) + keyboard (OSK
# haptic). The Portal is printed with Xbox positions (A at the bottom), so
# its default map is the positional ayn_mcu_thor; sm8550-face-buttons can
# switch it to ayn_mcu_nintendo. The back buttons M1/M2 are their own
# gpio-keys device (BTN_Z/BTN_C, DT append); ayn_mcu* map them to the paddles.
#
# InputPlumber's stock 50-ayn_odin2.yaml also matched the Portal; PB-OS
# replaces that file with an Odin 2-only one, so this is the Portal's one
# config. Matched by model.
#
# Do not list USB/BT as ignore sources: the Deck controller is USB (VID 28de) and
# matching it as a source restarts the composite in a loop (cursor, no Steam).
# External HID is handled by sm8550-inputplumber-ext-hid (drop keyboard target).
version: 1
kind: CompositeDevice
name: AYN Odin 2 Portal

matches:
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: AYN Odin 2 Portal

single_source: false

source_devices:
  - group: gamepad
    evdev:
      phys_path: rsinput-gamepad/input0
      handler: event*
    capability_map_id: ayn_mcu_thor
    passthrough: false

  - group: gamepad
    evdev:
      name: gpio-keys-paddles
      handler: event*
    capability_map_id: ayn_mcu_thor
    passthrough: false

options:
  auto_manage: true

# deck-uhid first, as steamos-manager sets it at boot anyway;
# sm8550-inputplumber-ext-hid then switches to the real Steam Deck (deck).
target_devices:
  - deck-uhid
  - keyboard
