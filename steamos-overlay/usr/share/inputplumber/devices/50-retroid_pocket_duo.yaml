# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/composite_device_v1.json
# Retroid Pocket Duo (SM7750) rsinput → a real Steam Deck controller (deck).
# InputPlumber 0.81 has no Duo config. ROCKNIX's rsinput driver (matches
# the Duo through kernel all/patches/0561) names the pad from Retroid's DT
# (gamepad-name "RetroidPocket Gamepad", 2020:3001) and reports the same
# buttons as on the Retroid Pocket 6 / Nova, so this uses their Nintendo
# face-button map (rsinput_nintendo). Volume up stays on gpio-keys, which
# InputPlumber leaves alone (retroid-pocket-duo.toml).
#
# UNTESTED (no Duo in hand): check the printed face-button layout, the stick
# ranges (sm8550-fixpad) and whether the pad needs a keyboard target for the
# on-screen keyboard's haptics.
#
# Do not list USB/BT as sources: the Deck controller is USB (VID 28de) and
# matching it as a source restarts the composite in a loop.
version: 1
kind: CompositeDevice
name: Retroid Pocket Duo

matches:
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: compatible
          value: retroidpocket,rpduo

single_source: false

source_devices:
  - group: gamepad
    capability_map_id: rsinput_nintendo
    evdev:
      phys_path: rsinput-gamepad/input0
      vendor_id: "2020"
      product_id: "3001"
      handler: event*
    passthrough: false

options:
  auto_manage: true

# deck-uhid first, as steamos-manager sets it at boot anyway;
# sm8550-inputplumber-ext-hid then switches to the real Steam Deck (deck).
target_devices:
  - deck-uhid
