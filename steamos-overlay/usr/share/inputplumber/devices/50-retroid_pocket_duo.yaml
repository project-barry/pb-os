# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/composite_device_v1.json
# Retroid Pocket Duo (SM7750) rsinput → a real Steam Deck controller (deck).
# InputPlumber 0.81 has no Duo config. ROCKNIX's rsinput driver (matches
# the Duo through kernel all/patches/0561) names the pad from Retroid's DT
# (gamepad-name "RetroidPocket Gamepad", 2020:3001) and reports the same
# buttons as on the Retroid Pocket 6 / Nova, so this uses their Nintendo
# face-button map (rsinput_nintendo). Volume up stays on gpio-keys, which
# InputPlumber leaves alone (retroid-pocket-duo.toml).
#
# The keyboard target and Barry Launcher's Deck controls as on the AYN Thor.
# Untested: the printed face-button layout and the Deck controls.
#
# Do not list USB/BT as sources: the Deck controller is USB (VID 28de) and
# matching it as a source restarts the composite in a loop.
version: 1
kind: CompositeDevice
name: Retroid Pocket Duo

matches:
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: compatible
          value: retroidpocket,rpduo

single_source: false

source_devices:
  - group: gamepad
    capability_map_id: rsinput_nintendo
    evdev:
      phys_path: rsinput-gamepad/input0
      vendor_id: "2020"
      product_id: "3001"
      handler: event*
    passthrough: false
  # Barry Launcher's Deck controls (DeckControls.qml, Barry.Input): the Deck's
  # trackpads and back buttons, drawn on the bottom screen, as more of this
  # controller. Present only while Barry's Deck app is open. The pads need
  # InputPlumber patch 0004 (touchscreen as trackpad).
  - group: barry_deck
    # Re-made at once when the Deck view reloads (a skin change): join
    # the running composite even while it still holds the old ones.
    unique: false
    evdev:
      name: Barry Deck Left Pad
      handler: event*
    config:
      touchscreen:
        trackpad: left
  - group: barry_deck
    # Re-made at once when the Deck view reloads (a skin change): join
    # the running composite even while it still holds the old ones.
    unique: false
    evdev:
      name: Barry Deck Right Pad
      handler: event*
    config:
      touchscreen:
        trackpad: right
  - group: barry_deck
    # Re-made at once when the Deck view reloads (a skin change): join
    # the running composite even while it still holds the old ones.
    unique: false
    evdev:
      name: Barry Deck Buttons
      handler: event*
    capability_map_id: barry_deck_buttons
  # The built-in accelerometer and gyroscope (pbos-motiond, through the
  # ADSP's sensor hub), already in the Deck's frame: Steam's gyro settings.
  # Needs InputPlumber patch 0006 (evdev motion sensors).
  - group: imu
    evdev:
      name: PB-OS Motion Sensors
      handler: event*

options:
  auto_manage: true

# deck-uhid first, as steamos-manager sets it at boot anyway;
# sm8550-inputplumber-ext-hid then switches to the real Steam Deck (deck).
target_devices:
  - deck-uhid
  - keyboard
