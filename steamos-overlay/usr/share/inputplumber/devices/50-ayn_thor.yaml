# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/composite_device_v1.json
# AYN Thor rsinput → virtual Steam Deck (deck: a real Deck controller, USB/IP)
# + keyboard (OSK haptic). The real Deck (28de:1205), not deck-uhid's generic
# 12f0, as on every device; Steam shows Barry Launcher's Deck trackpads only
# on it.
# steamos-manager resets the composite to deck-uhid (its device file allows
# no other); sm8550-inputplumber-ext-hid puts it back.
# Same as 50-ayn_odin2.yaml (without the M1/M2 back buttons), with the Thor's Nintendo face buttons
# (ayn_mcu_nintendo: the printed A is Steam's A).
#
# Installed over InputPlumber's own 50-ayn_thor.yaml so the Thor has one
# config. It leaves out the AYN key (gpio-keys-ayn): no config claims it,
# and sm8550-thor-backlightd uses it for the bottom-screen dashboard.
#
# Do not list USB/BT as ignore sources: deck-uhid is USB (VID 28de) and
# matching it as a source restarts the composite in a loop (cursor, no Steam).
# External HID is handled by sm8550-inputplumber-ext-hid (drop keyboard target).
version: 1
kind: CompositeDevice
name: AYN Thor

matches:
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: AYN Thor

single_source: false

source_devices:
  - group: gamepad
    evdev:
      phys_path: rsinput-gamepad/input0
      handler: event*
    capability_map_id: ayn_mcu_nintendo
    passthrough: false
  # Barry Launcher's Deck controls (DeckControls.qml, Barry.Input): the Deck's
  # trackpads and back buttons, drawn on the bottom screen, as more of this
  # controller. Present only while Barry's Deck app is open. The pads need
  # InputPlumber patch 0004 (touchscreen as trackpad).
  - group: barry_deck
    # Re-made at once when the Deck view reloads (a skin change): join
    # the running composite even while it still holds the old ones.
    unique: false
    evdev:
      name: Barry Deck Left Pad
      handler: event*
    config:
      touchscreen:
        trackpad: left
  - group: barry_deck
    # Re-made at once when the Deck view reloads (a skin change): join
    # the running composite even while it still holds the old ones.
    unique: false
    evdev:
      name: Barry Deck Right Pad
      handler: event*
    config:
      touchscreen:
        trackpad: right
  - group: barry_deck
    # Re-made at once when the Deck view reloads (a skin change): join
    # the running composite even while it still holds the old ones.
    unique: false
    evdev:
      name: Barry Deck Buttons
      handler: event*
    capability_map_id: barry_deck_buttons
  # The built-in accelerometer and gyroscope (pbos-motiond, through the
  # ADSP's sensor hub), already in the Deck's frame: Steam's gyro settings.
  # Needs InputPlumber patch 0006 (evdev motion sensors).
  - group: imu
    evdev:
      name: PB-OS Motion Sensors
      handler: event*

options:
  auto_manage: true

# deck-uhid first, as steamos-manager sets it at boot anyway;
# sm8550-inputplumber-ext-hid then switches to the real Steam Deck (deck).
target_devices:
  - deck-uhid
  - keyboard
