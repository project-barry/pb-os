# Box64 swaps liblzma for its native wrapper, but the wrapper hands Python's
# x86 lzma allocator (PyLzma_Malloc) to native liblzma, which then jumps into
# x86 code: SIGILL in the plugin backend on any .tar.xz (Decky LSFG-VK's
# "Install" hung forever with the loader spinning). PyInstaller bundles an x86
# liblzma.so.5 with Decky, so emulate that one instead.
[Service]
Environment=BOX64_EMULATED_LIBS=liblzma.so.5
