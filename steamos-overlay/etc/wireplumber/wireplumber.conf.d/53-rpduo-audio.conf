# Retroid Pocket Duo (card ELIZA-RetroidPocket-I2S): Retroid's UCM "HiFi"
# profile (AW88166 speakers on Primary MI2S, ES8326 headset on Quaternary
# MI2S, DMICs on the VA macro; ucm2/RetroidPocket/ELIZA). The SM8550 rules
# (52-sm8550-alsa.conf) turn auto-profile/auto-port off and pro-audio, which
# 51-sm8550-hifi-priority.conf ranks above any profile it doesn't name,
# would open raw PCMs without the UCM routes: silent amps. sm8550-audio-pipewire
# skips the Duo too. Device rules only see the monitor's api.alsa.*
# properties, so match the card name there.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.platform-sound", api.alsa.card.name = "ELIZA-RetroidPocket-I2S" }
    ]
    actions = {
      update-props = {
        api.acp.auto-profile = true
        api.acp.auto-port = true
        device.profile = "HiFi"
      }
    }
  }
]

device.profile.priority.rules = [
  {
    matches = [
      { device.name = "alsa_card.platform-sound", api.alsa.card.name = "ELIZA-RetroidPocket-I2S" }
    ]
    actions = {
      update-props = {
        priorities = [ "HiFi" ]
      }
    }
  }
]
