# KONKR Pocket FIT / AYANEO Pocket S2: Steam's Sleep → logind → this unit →
# konkr-suspend, which runs kernel deep sleep (prepared by konkr-sleep.service)
# or konkr-standby (no kernel suspend), as konkr-sleep-mode says.
[Unit]
ConditionPathExists=/usr/lib/konkr/konkr-suspend

[Service]
ExecStart=
ExecStart=/usr/lib/konkr/konkr-suspend
