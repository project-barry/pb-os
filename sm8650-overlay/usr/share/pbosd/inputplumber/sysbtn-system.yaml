# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/capability_map_v2.json
# Variant: system (F13/F14 for pbosd actions)
# MCU "system" buttons from konkr_sysbtn (the MCU link, on by default).
# IDs follow the Elite driver (ROCKNIX 0069); positions verified on a
# Pocket FIT:
#   HAPPY5   Custom Function (above ABXY)                  → see below
#   HAPPY1   K (larger button below the right stick)       → see below
#   HAPPY2   = (smaller button below the right stick)      → Quick Access
#   HAPPY3/4 LC / RC (top, next to the left/right bumper)  → L5 / R5
#
# pbosd installs one of two variants (/usr/share/pbosd/inputplumber/) as
# /etc/inputplumber/capability_maps.d/konkr_pocketfit_sysbtn.yaml, following
# PB-OS Utils → Hardware → Buttons → "Steam Remap" (state.json "buttons_mode"), and
# restarts InputPlumber when it changes:
#   sysbtn-steam.yaml   (default) Custom Function / K → left/right trackpad click.
#                       The Deck controller has no spare buttons (L4/R4/L5/R5
#                       are in use), but this device has no trackpads, so
#                       their clicks are free and Steam can bind them per game.
#   sysbtn-system.yaml  Custom Function / K → F14/F13 for pbosd's actions
#                       (performance profile, stick lighting, ...).
# InputPlumber profiles cannot translate to or from trackpad clicks, so the
# switch has to be made in the capability map.
version: 2
kind: CapabilityMap
name: KONKR Pocket FIT MCU buttons (Steam Deck layout)
id: konkr_pocketfit_sysbtn

mapping:
  - name: K → F13 (pbosd)
    source_events:
      - evdev: {event_type: KEY, event_code: BTN_TRIGGER_HAPPY1, value_type: button}
    target_event:
      keyboard: KeyF13
  - name: = → Quick Access
    source_events:
      - evdev: {event_type: KEY, event_code: BTN_TRIGGER_HAPPY2, value_type: button}
    target_event:
      gamepad: {button: QuickAccess}
  - name: LC → L5
    source_events:
      - evdev: {event_type: KEY, event_code: BTN_TRIGGER_HAPPY3, value_type: button}
    target_event:
      gamepad: {button: LeftPaddle2}
  - name: RC → R5
    source_events:
      - evdev: {event_type: KEY, event_code: BTN_TRIGGER_HAPPY4, value_type: button}
    target_event:
      gamepad: {button: RightPaddle2}
  - name: Custom Function → F14 (pbosd)
    source_events:
      - evdev: {event_type: KEY, event_code: BTN_TRIGGER_HAPPY5, value_type: button}
    target_event:
      keyboard: KeyF14

filtered_events: []
