# Pocket FIT speakers: louder without clipping.
#
# Mainline caps the WSA884x amp at 0 dB (no speaker protection on Linux),
# so the speakers were much quieter than on Android. This runs inside the
# speaker sink only (audioconvert filter graph), so headphones, HDMI and
# Steam's volume bar / konkr-volume are untouched:
#   - 4th-order high-pass at 220 Hz: the drivers can't reproduce that bass,
#     it only costs excursion and headroom.
#   - x42 Digital Peak Limiter (dpl.lv2): +12 dB, true-peak ceiling -1 dBFS.
# Full-scale material comes out no hotter than before (the limiter holds it
# at -1 dBFS); average-level game audio gets up to 12 dB louder. Measured on
# the device at +8 dB: -20 dBFS in -> -12 out, 0 dBFS in -> -1.0 out, 60 Hz
# -37 dB. +12 dB was picked by ear on the Pocket FIT (+8 was still quiet).
#
# Off: pbosctl speaker flat (on again: pbosctl speaker boost).
monitor.alsa.rules = [
  {
    matches = [ { node.name = "alsa_output.platform-sound.HiFi__Speaker__sink" } ]
    actions = {
      update-props = {
        audioconvert.filter-graph.0 = {
          nodes = [
            { type = builtin name = hpL1 label = bq_highpass control = { "Freq" = 220.0 "Q" = 0.5412 } }
            { type = builtin name = hpL2 label = bq_highpass control = { "Freq" = 220.0 "Q" = 1.3066 } }
            { type = builtin name = hpR1 label = bq_highpass control = { "Freq" = 220.0 "Q" = 0.5412 } }
            { type = builtin name = hpR2 label = bq_highpass control = { "Freq" = 220.0 "Q" = 1.3066 } }
            { type = lv2 name = lim plugin = "http://gareus.org/oss/lv2/dpl#stereo"
              control = { "gain" = 12.0 "threshold" = -1.0 "release" = 0.01 "truepeak" = 1 } }
          ]
          links = [
            { output = "hpL1:Out" input = "hpL2:In" }
            { output = "hpR1:Out" input = "hpR2:In" }
            { output = "hpL2:Out" input = "lim:inL" }
            { output = "hpR2:Out" input = "lim:inR" }
          ]
          inputs = [ "hpL1:In" "hpR1:In" ]
          outputs = [ "lim:outL" "lim:outR" ]
        }
      }
    }
  }
]
