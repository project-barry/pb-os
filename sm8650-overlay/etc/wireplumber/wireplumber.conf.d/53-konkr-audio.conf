# KONKR Pocket FIT / SM8650-APS2: use the UCM HiFi profile (WSA884x speakers +
# WCD939x headphones) and let ACP switch ports on the headphone jack.
# The SM8550 rules (52-sm8550-alsa.conf) turn auto-profile/auto-port off and
# the sm8550-audio-pipewire helper forces "pro-audio" with Odin 2 MI2S mixer
# routes — on this card that opens raw PCMs without the UCM sequences and the
# DSP rejects the graph (q6apm "Failed to start APM port", no sound).
# The one image also runs on SM8550, whose card has the same device name, so
# match the SM8650 card's name too (sound model "SM8650-APS2": Pocket FIT and
# Pocket S2).
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.platform-sound", alsa.card_name = "SM8650-APS2" }
    ]
    actions = {
      update-props = {
        api.acp.auto-profile = true
        api.acp.auto-port = true
        device.profile = "HiFi (Headphones, Speaker)"
        # UCM's PlaybackMixerElem "Speakers" is the WSA884x amp gain: 18 steps,
        # -9..+16.5 dB, lowest step = mute. Used as the hardware volume, low
        # volume muted the amp and the sink never recovered. Volume in software;
        # the amp gain is fixed by sm8550-audio-setup.
        api.alsa.soft-mixer = true
      }
    }
  }
]
