# pbosd — KONKR Pocket FIT platform daemon. `sudo systemctl restart pbosd`
# after editing (or `pbosctl profile …` for the profile itself).

[buttons]
# F13/F14/F15 come from the InputPlumber keyboard. The Custom Function and K
# buttons send them only in system button mode (PB-OS Utils → Hardware →
# "Steam Remap" off, or `pbosctl buttons system`); by default they are
# trackpad clicks for Steam. Overridden per button by PB-OS Utils → Hardware.
# Actions: profile-next | profile-lowpower | profile-balanced | rgb-next |
#          sticks-toggle | none
# Custom Function (above ABXY)
F14 = profile-next
# K (larger button below the right stick)
F13 = rgb-next
F15 = none

[fan]
enabled = yes
# floor for the curve (0..255); raise it if you prefer a constant hum
min_pwm = 0
# written if pbosd stops or crashes
failsafe_pwm = 180

[games]
# uclamp.min boost + keep game threads off the A520 little cores
boost = yes
avoid_little_cores = yes
