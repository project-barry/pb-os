# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/composite_device_v1.json
# AYANEO Pocket S2 (SM8650) → a real Steam Deck controller (deck; valid
# in InputPlumber ≥ 0.70 even though the bundled JSON schema does not list it)
# + keyboard (OSK, F13/F14 hotkeys).
#
# The built-in pad runs in one of two modes, depending on the unit/firmware
# (upstream InputPlumber PR #670 documents both):
#   - XInput:      "Microsoft X-Box 360 pad" 045e:028e (xpad: triggers Z/RZ)
#   - DirectInput: "AYANEO Controller" 4001:0428 (right stick Z/RZ, triggers
#                  Brake/Gas) + "AYANEO DEVICE" 1c4f:0002 for the AYANEO/side/L4/R4
#                  buttons
# (upstream InputPlumber 50-ayaneo_pocket_s2.yaml has the same layout).
# Sources are optional: the composite forms from whichever appear. The first
# matching source entry wins, so the id-specific ones come before the
# port-based fallback.
version: 1
kind: CompositeDevice
name: AYANEO Pocket S2

matches:
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: AYANEO Pocket S2

single_source: false

source_devices:
  - group: gamepad
    evdev:
      vendor_id: "4001"
      product_id: "0428"
      handler: event*
    capability_map_id: ayaneo_pocket_s2_dinput
  # Same pad, its HID node: rumble. The motors only take an output report
  # in this mode (byte 4 left, byte 5 right); InputPlumber >= 0.79 sends it.
  - group: gamepad
    hidraw:
      vendor_id: 0x4001
      product_id: 0x0428
      interface_num: 0
  - group: gamepad
    evdev:
      vendor_id: "045e"
      product_id: "028e"
      handler: event*
    capability_map_id: konkr_pocketfit_deck
  - group: gamepad
    evdev:
      vendor_id: "1c4f"
      product_id: "0002"
      handler: event*
    capability_map_id: ayaneo_pocket_s2_aux
  # Whatever else is on the pad's internal USB port (port 2 on some units,
  # 1 on others): unclaimed, Steam shows the raw pad with the Xbox layout and
  # no Quick Access. InputPlumber matches phys_path literally (no globs).
  - group: gamepad
    evdev:
      phys_path: usb-0001:01:00.0-2/input0
      handler: event*
    capability_map_id: konkr_pocketfit_deck
  - group: gamepad
    evdev:
      phys_path: usb-0001:01:00.0-1/input0
      handler: event*
    capability_map_id: konkr_pocketfit_deck

options:
  auto_manage: true

# deck-uhid first, as steamos-manager sets it at boot anyway;
# sm8550-inputplumber-ext-hid then switches to the real Steam Deck (deck).
target_devices:
  - deck-uhid
  - keyboard
