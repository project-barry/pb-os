# TEST ONLY (2026-10-06) progress point (gcc + gpu_cc state_synced forced at runtime): TSENS wake off; Bluetooth + KONKR MCU
# 2026-10-06 audio round 1: CLKSNAP removed, audio released before sleep (~/audio-release.sh)
# 2026-10-07: /proc/interrupts + battery snapshot around each sleep to find the self-wake IRQ
# UARTs released; clock snapshot + pbtest marker; pcid3dbg force_bridge_d3=1 fix_ahb=1 (insmod after
# boot); Renesas fw reloaded on resume by the patched xhci_pci_renesas (~/xhci-pci-renesas-fwreload.ko). Console is off ttyMSM0 (cmdline console=tty0).
[Service]
ExecStopPost=-/bin/sh -c 't=$(date +%%H%%M%%S); cat /proc/interrupts > /var/tmp/irq-post-$t.txt; cp /var/tmp/irq-pre.txt /var/tmp/irq-pre-$t.txt; cat /var/tmp/batt-pre.txt /sys/class/power_supply/battery/capacity /sys/class/power_supply/battery/charge_counter > /var/tmp/batt-$t.txt'
ExecStartPre=-/bin/sh -c 'for w in /sys/devices/platform/soc@0/*.thermal-sensor/power/wakeup; do echo disabled > $w; done; rfkill block bluetooth; echo serial1-0 > /sys/bus/serial/drivers/konkr_sysbtn/unbind; sleep 1'
ExecStartPre=-/home/steamos/audio-release.sh suspend
ExecStartPre=-/bin/sh -c 'cat /sys/class/power_supply/battery/capacity /sys/class/power_supply/battery/charge_counter > /var/tmp/batt-pre.txt; cat /proc/interrupts > /var/tmp/irq-pre.txt'
ExecStopPost=-/bin/sh -c 'for w in /sys/devices/platform/soc@0/*.thermal-sensor/power/wakeup; do echo enabled > $w; done; echo serial1-0 > /sys/bus/serial/drivers/konkr_sysbtn/bind; rfkill unblock bluetooth'
ExecStopPost=-/bin/sh -c 'f=/var/tmp/stats-after-$(date +%%H%%M%%S).txt; for s in apss aosd cxsd ddr; do echo "$s: $(head -4 /sys/kernel/debug/qcom_stats/$s | tr "\\n" " ")"; done > $f; head -3 /sys/kernel/debug/qcom_stats/ddr_stats >> $f; sync'
ExecStopPost=-/home/steamos/audio-release.sh resume
